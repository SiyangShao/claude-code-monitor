services:
  server:
    build:
      context: .
      dockerfile: Dockerfile.server
    volumes:
      - server-data:/data
      - ./config:/config:ro
      # Mount SSH keys if using SSH polling (optional)
      # - ~/.ssh:/root/.ssh:ro
    network_mode: "service:tailscale"
    restart: unless-stopped
    environment:
      - CLAUDE_MONITOR_CONFIG=/config/server-config.json
      - CLAUDE_MONITOR_DB=/data/server.db
    depends_on:
      - tailscale

  tailscale:
    image: tailscale/tailscale:latest
    hostname: claude-monitor
    ports:
      # Expose on host network too (optional, for local access)
      - "19876:19876"
    cap_add:
      - NET_ADMIN
      - SYS_MODULE
    volumes:
      - tailscale-state:/var/lib/tailscale
      - /dev/net/tun:/dev/net/tun
    environment:
      - TS_AUTHKEY=${TS_AUTHKEY:-}
      - TS_STATE_DIR=/var/lib/tailscale
      - TS_USERSPACE=false
    restart: unless-stopped

volumes:
  server-data:
  tailscale-state:
