<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Claude Code Monitor</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="header">
    <span class="title">Claude Code Monitor</span>
    <div style="display: flex; align-items: center; gap: 8px;">
      <span id="status-summary"></span>
      <button class="btn" onclick="openSettings()" title="Settings" style="opacity:0.6; border:none; font-size:14px;">&#9881;</button>
    </div>
  </div>
  <div id="productivity-bar"></div>
  <div id="sessions"></div>
  <div id="empty-state">
    <div style="font-size: 24px; margin-bottom: 8px;">No sessions</div>
    <div style="font-size: 11px; color: #636366;">Waiting for agent reports...</div>
  </div>
  <script src="app.js"></script>
</body>
</html>
